<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Forms</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="form">
    <legend class="login">
        Login
    </legend>
    <fieldset>
        <form>
        <div>
        <p>
            Username
        </p>
        <input type="text">
        <i class="fas fa-user"></i>
       </div>
    <div>
        <p>
            Password
        </p>
        <input type="password">
        <i class="fas fa-key"></i>
    </div>
    <button>Login</button>
</form>
    </fieldset>
</div>
</body>
</html>
